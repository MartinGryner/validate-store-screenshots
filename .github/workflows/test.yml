name: Test bundled action
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          directory: fixtures/passing/screenshots
          target: apple-iphone-69
      - uses: ./
        id: bad
        continue-on-error: true
        with:
          directory: fixtures/failing/screenshots
          target: apple-iphone-69
      - name: Assert invalid fixture failed
        if: steps.bad.outcome != 'failure'
        shell: bash
        run: exit 1
